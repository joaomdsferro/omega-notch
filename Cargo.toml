[workspace]
resolver = "2"
members = [
    "crates/omega-notch-core",
    "crates/omega-notch-engine",
]
default-members = ["crates/omega-notch-engine"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT"
authors = ["João Ferro <joaoferro.business@gmail.com>"]
repository = "https://github.com/joaomdsferro/omega-notch"

[workspace.dependencies]
omega-notch-core = { path = "crates/omega-notch-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
libc = "0.2"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
