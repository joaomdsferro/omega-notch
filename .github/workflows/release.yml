# Builds the Linux download (prebuilt binaries + installer) and the macOS one
# (a notarised disk image) and attaches them to a draft release. Push a tag
# such as v0.0.3, or run it by hand; the release stays a draft until it is
# published on GitHub.
#
# Run by hand, it is a dry run unless told otherwise: everything is built,
# signed and notarised, and nothing is released. That checks the secrets
# without touching a published release.
#
# The macOS job signs with secrets kept in the "release" environment, which
# should require a reviewer: MACOS_CERTIFICATE_P12 (the Developer ID
# Application certificate and key, as base64), MACOS_CERTIFICATE_PASSWORD,
# MACOS_NOTARY_KEY_P8 (an App Store Connect API key), MACOS_NOTARY_KEY_ID,
# MACOS_NOTARY_ISSUER and SPARKLE_PRIVATE_KEY (the EdDSA key that signs
# updates, as `generate_keys -x` writes it).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and notarise only; release nothing"
        type: boolean
        default: true

permissions:
  contents: write

# One release at a time: two runs replacing the same disk image and appcast
# could leave a feed whose signature does not match the download. Waiting
# runs queue up instead of replacing each other, so no tag goes unreleased.
concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    # Plasma 6's Qt and LayerShellQt are not on Ubuntu, so build on Arch; the
    # download targets Arch-based distributions.
    container: archlinux:base-devel
    steps:
      - name: System libraries
        run: |
          pacman -Syu --noconfirm --needed git rust cmake ninja \
            qt6-base qt6-declarative qt6-wayland layer-shell-qt kidletime

      # Third-party actions are pinned to a commit; the comment names its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The appcast points at v<Cargo.toml version>, so a tag that names any
      # other version would publish a feed whose download does not exist.
      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml's version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all --check

      - run: cargo test -p omega-notch-core --locked

      - run: make dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ !inputs.dry_run }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Omega Notch v${{ steps.version.outputs.version }}
          draft: true
          # A pre-release is never "Latest", so it would hide behind the one
          # before it.
          prerelease: false
          files: |
            target/dist/*.tar.gz
            target/dist/*.tar.gz.sha256
          body: |
            A test version. Expect bugs, missing features and settings that change between versions.
            Omega Notch is an unofficial tool, not affiliated with Anthropic, Anysphere (Cursor), GitHub, OpenAI or xAI.

            On Linux: needs KDE Plasma 6 on Wayland. The download is built for Arch-based distributions (Arch, CachyOS, EndeavourOS);
            elsewhere, build from source. Unpack it and run `./install.sh`.
            On a Mac: macOS 14 or later, Apple silicon or Intel. Open the disk image and drag Omega Notch to Applications.
            See the README for how to install and how to report a problem.

  macos:
    # After the Linux job, which creates the draft release this one adds to
    # and checks the tag against the version.
    needs: linux
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # A keychain of its own, with a random password, that only this job
      # uses and that is deleted at the end.
      - name: Signing keychain
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          test -n "$identity"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Notary key
        env:
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: (umask 077 && printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8")

      - name: Build, sign and notarise
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/macos-release.sh

      - name: Attach to the draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          gh release upload "$tag" target/dist/*.dmg target/dist/*.dmg.sha256 target/dist/appcast.xml --clobber

      - name: Clean up
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
