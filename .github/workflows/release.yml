# Builds the Linux download (prebuilt binaries + installer) and attaches it to
# a draft pre-release. Push a tag such as v0.0.3, or run it by hand; the
# release stays a draft until it is published on GitHub.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # Plasma 6's Qt and LayerShellQt are not on Ubuntu, so build on Arch; the
    # download targets Arch-based distributions.
    container: archlinux:base-devel
    steps:
      - name: System libraries
        run: |
          pacman -Syu --noconfirm --needed git rust cmake ninja \
            qt6-base qt6-declarative qt6-wayland layer-shell-qt

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all --check

      - run: cargo test -p omega-notch-core --locked

      - run: make dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Omega Notch v${{ steps.version.outputs.version }}
          draft: true
          prerelease: true
          files: |
            target/dist/*.tar.gz
            target/dist/*.tar.gz.sha256
          body: |
            A test version. Expect bugs, missing features and settings that change between versions.
            Omega Notch is an unofficial tool, not affiliated with Anthropic, Anysphere (Cursor), GitHub, OpenAI or xAI.

            Needs KDE Plasma 6 on Wayland. The download is built for Arch-based distributions (Arch, CachyOS, EndeavourOS);
            elsewhere, build from source. Unpack it and run `./install.sh`. See the README for how to install and how to report a problem.
