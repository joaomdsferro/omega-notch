# Checks the Rust formatting and lints, runs the engine's tests on Linux and macOS, and the macOS shell's tests,
# for every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to a commit; the comment names its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo fmt --all --check

      # Linux only until the macOS-only code has been checked clean too.
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked

      # The two shells hold the same theme tokens; a change in one and not the
      # other would leave them looking different.
      - run: python3 scripts/check_themes.py

  macos-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: swift test
        working-directory: ui/macos
